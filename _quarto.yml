project:
  type: website
  output-dir: docs
  render:
    - "*.qmd"
    - "projects/*.qmd"
    - "blog/**/*.qmd"
    - "courses/*.qmd"
    - "!cv/"
  pre-render:
    # Pulls the latest mathviz release into _extensions/ (see CLAUDE.md §6).
    - _scripts/update-mathviz.sh
    - _scripts/build_home_lists.py

website:
  title: "Apurva Nakade"
  description: "Assistant Teaching Professor of Applied Mathematics & Statistics at Johns Hopkins University."
  navbar:
    left:
      - text: Home
        href: index.qmd
      - text: Projects
        href: projects/index.qmd
      - text: Blog
        href: blog/index.qmd
      - text: Teaching
        menu:
          - text: Teaching portfolio
            href: teaching-portfolio.qmd
          - text: Course pages
            href: courses/index.qmd
          - text: AMS course explorer
            href: https://apurvanakade.github.io/AMS-courses/
          - text: Recommendation letters
            href: rec-letters.qmd
      - text: CV
        href: CV.qmd
    right:
      - icon: github
        href: https://github.com/apurvanakade/
        aria-label: GitHub
  page-footer:
    center: "&copy; 2026 Apurva Nakade"
  # No sidebar for the blog subtree. The blog index already lists every post,
  # and every post has a back-link, so a sidebar would be a
  # column of duplicate navigation.
  # The standalone blog used an explicit sidebar file list and it had already
  # gone stale (it still pointed at a post deleted months earlier); listings
  # cannot rot that way.
  open-graph: true
  site-url: https://apurvanakade.github.io/
  repo-url: https://github.com/apurvanakade/apurvanakade.github.io/
  search:
    type: overlay
    location: navbar

format:
  html:
    theme:
      light: [_extensions/apurvanakade/mathviz/theme/mathviz-light.scss, _theme/base.scss]
      dark: [_extensions/apurvanakade/mathviz/theme/mathviz-dark.scss, _theme/base.scss]
    include-in-header: _includes/fonts.html
    css: styles.css   # yours to edit; _theme/*.scss is AI-owned
    anchor-sections: true
    link-external-newwindow: true
    link-external-filter: '^(?:http:|https:)\/\/(?:www\.)?apurvanakade\.github\.io'
