# AI-owned. Builds the site with Quarto and deploys it to GitHub Pages on
# every push to main (a release: `make release` fast-forwards main to
# develop).
#
# This uses GitHub's native Pages deployment (upload-pages-artifact +
# deploy-pages), which matches the repo setting Settings -> Pages -> Source:
# "GitHub Actions". Nothing is pushed to a gh-pages branch: the built site is
# uploaded as an artifact and served straight from it. See CLAUDE.md §2.
name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Render the site
        uses: ./.github/actions/render

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
