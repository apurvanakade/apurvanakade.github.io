# AI-owned. Renders the site into docs/, the same way `make build` does
# locally. Shared by publish.yml and pr-check.yml so the two renders can't
# drift apart. See CLAUDE.md §2.

name: Render the site
description: Install Quarto, then quarto render --to html

runs:
  using: composite
  steps:
    - name: Set up Quarto
      uses: quarto-dev/quarto-actions/setup@v2
      with:
        version: "1.11.9"   # keep in sync with the version used locally

    - name: Render site
      shell: bash
      run: quarto render --to html
      # HTML only: the CV and teaching portfolio PDFs are built locally with
      # `make pdfs` and never published, so CI needs no LaTeX (CLAUDE.md §4).
      # No R, no Python: every code cell is Observable JS, which runs in the
      # reader's browser (CLAUDE.md §2). _extensions/ is gitignored: the
      # pre-render hook installs the latest mathviz release (CLAUDE.md §6).
