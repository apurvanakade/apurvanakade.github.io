# AI-owned. Renders the site into docs/, the same way `make build` does
# locally. Shared by publish.yml and pr-check.yml so the two renders can't
# drift apart. See CLAUDE.md §2.

name: Render the site
description: Install Quarto, then quarto render --to html

runs:
  using: composite
  steps:
    - name: Set up Quarto
      uses: quarto-dev/quarto-actions/setup@v2
      with:
        version: "1.10.18"   # keep in sync with the version used locally

    - name: Render site
      shell: bash
      run: quarto render --to html
      # HTML only: CV.qmd's PDF format is built locally with `make cv` and
      # committed as CV.pdf, so CI needs no LaTeX. No R, no Python: every code
      # cell is Observable JS, which runs in the reader's browser (see
      # CLAUDE.md §2). The pre-render hook fetches the latest mathviz release.
