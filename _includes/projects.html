<!-- AI-owned: included after the body of every page in projects/ by
     projects/_metadata.yml. See CLAUDE.md §5.

     Institution categories (JHU, Northwestern, UWO, Mathcamp) get the inst-chip
     classes, so _theme/base.scss can colour them. A category chip carries
     nothing but its text, so this cannot be done in CSS alone. The listing's
     category cloud is moved above the grid by mathviz (`category-cloud` in
     projects/index.qmd), not here. -->
<script>
(function () {
  var INST = { "JHU": "jhu", "Northwestern": "nw", "UWO": "uwo", "Mathcamp": "mc" };

  function label(el) {
    // A category chip is just "name", a single text node.
    var t = "";
    el.childNodes.forEach(function (n) { if (n.nodeType === 3) t += n.textContent; });
    return t.trim();
  }

  document.querySelectorAll(".listing-category, .quarto-category").forEach(function (el) {
    var key = INST[label(el)];
    if (key) el.classList.add("inst-chip", "inst-chip--" + key);
  });
})();
</script>
