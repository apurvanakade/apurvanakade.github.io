<!-- AI-owned: included after the body of every page in projects/ by
     projects/_metadata.yml. See CLAUDE.md §5.

     1. Institution categories (JHU, Northwestern, UWO, Mathcamp) get the inst-chip
        classes, so _theme/base.scss can colour them. A category chip carries
        nothing but its text, so this cannot be done in CSS alone.
     2. On the listing, Quarto puts the category cloud (`categories: cloud`)
        in the right margin. It is moved above the grid, the empty margin is
        dropped and <main> is re-centred, so the page has one column. The entries keep their
        elements, so Quarto's filtering still works. -->
<script>
(function () {
  var INST = { "JHU": "jhu", "Northwestern": "nw", "UWO": "uwo", "Mathcamp": "mc" };

  function label(el) {
    // A cloud entry is "name <span>(n)</span>"; a chip is just "name".
    var t = "";
    el.childNodes.forEach(function (n) { if (n.nodeType === 3) t += n.textContent; });
    return t.trim();
  }

  document.querySelectorAll(".listing-category, .quarto-category").forEach(function (el) {
    var key = INST[label(el)];
    if (key) el.classList.add("inst-chip", "inst-chip--" + key);
  });

  var cloud = document.querySelector(".quarto-listing-category");
  var listing = document.querySelector(".quarto-listing");
  if (!cloud || !listing) return;
  var margin = cloud.closest("#quarto-margin-sidebar");
  listing.parentNode.insertBefore(cloud, listing);
  if (margin) margin.remove();
  // Quarto set <main> to stop short of the margin; centre it instead.
  var main = document.querySelector("main.column-page-left");
  if (main) main.classList.replace("column-page-left", "column-page");

  // The cloud has no "All" entry, so a filter could not be cleared. An empty
  // data-category is Quarto's own "All"; this runs before DOMContentLoaded,
  // when quarto-listing.js attaches its click handlers, so it gets one too.
  var all = document.createElement("div");
  all.className = "category category--all";
  all.dataset.category = "";
  all.textContent = "all";
  cloud.insertBefore(all, cloud.firstChild);
})();
</script>
