# AI-owned: settings for the whole blog/ subtree. See CLAUDE.md.
# Every code cell in the blog is Observable JS, which runs in the reader's
# browser; nothing executes at render time, so there is no kernel and no freeze.
execute:
  echo: false
include-after-body: _includes/back-to-blog.html
# Posts get a quiet title block (date only); see .blog-post in _theme/base.scss.
# blog/index.qmd replaces this with blog-index.
body-classes: blog-post
# Comment threads live in the repo's GitHub Discussions (category
# Announcements, so only giscus opens threads), one per post URL. See CLAUDE.md §6.
# blog/index.qmd and blog/drafts/ switch them off.
comments:
  giscus:
    repo: apurvanakade/apurvanakade.github.io
    repo-id: MDEwOlJlcG9zaXRvcnkyODcwOTk0OTY=
    category: Announcements
    category-id: DIC_kwDOERzKaM4DIdts
    mapping: pathname
    reactions-enabled: true
    loading: lazy
    theme:
      light: light
      dark: dark_dimmed
