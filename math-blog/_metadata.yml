# AI-owned: settings for the whole math-blog/ subtree. See CLAUDE.md.
# Only posts/maths/nth-fibonacci.qmd actually executes Python; every other code
# cell is Observable JS, which runs in the reader's browser. freeze: auto keeps
# the executed output committed under _freeze/ so the kernel is needed only when
# that post itself changes.
jupyter: myenv
freeze: auto
execute:
  cache: true
  echo: false
